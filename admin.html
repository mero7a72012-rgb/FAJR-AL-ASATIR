
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم المؤسس | فجر الأساطير</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <main class="login-page">
    <div class="login-card">
      <div class="login-symbol">⚔</div>
      <p class="eyebrow">FAJR AL-ASATIR</p>
      <h1>بوابة المؤسس</h1>
      <p class="subtitle">مرحبًا بك في مركز إدارة البطولة</p>

      <form id="loginForm">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" placeholder="أدخل بريدك الإلكتروني" required>

        <label for="password">كلمة المرور</label>
        <input id="password" type="password" placeholder="أدخل كلمة المرور" required>

        <button type="submit">تسجيل الدخول</button>
        <p id="loginMessage" role="status"></p>
      </form>

      <div class="login-footer">COMMANDER ACCESS</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
